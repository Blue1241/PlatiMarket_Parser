[package]
name = "plati_rust_parser"
version = "0.2.0"
edition = "2021"
description = "Веб-интерфейс и парсер выгодных карточек и продавцов Plati.Market на Rust"

[dependencies]
anyhow = "1.0"
axum = "0.8"
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
futures = "0.3"
regex = "1.11"
reqwest = { version = "0.12", features = ["json", "gzip"] }
scraper = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
